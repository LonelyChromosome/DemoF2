name: Build Better Phenikaa iOS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-port
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Use CocoaPods integration
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned iPhone app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.zip
          shasum -a 256 dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.zip \
            > dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.sha256
          test -s dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.zip

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-2.1.3-iOS-unsigned
          path: |
            dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.zip
            dist/Better_Phenikaa_App_2.1.3_iOS_unsigned.sha256
          retention-days: 14
          if-no-files-found: error
